<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">push 한 번에 일어나는 일</text>

  <!-- card 1 -->
  <rect x="65" y="150" width="186" height="88" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="89" y="186" font-size="15" font-weight="600" fill="#1d1d1f">내 컴퓨터</text>
  <text x="89" y="210" font-size="13" fill="#86868b">코드 수정</text>

  <line x1="251" y1="194" x2="285" y2="194" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="293,194 284,189.5 284,198.5" fill="#86868b"/>
  <text x="272" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#0071e3">push</text>

  <!-- card 2 -->
  <rect x="293" y="150" width="186" height="88" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="317" y="186" font-size="15" font-weight="600" fill="#1d1d1f">GitHub</text>
  <text x="317" y="210" font-size="13" fill="#86868b">코드 보관소</text>

  <line x1="479" y1="194" x2="513" y2="194" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="521,194 512,189.5 512,198.5" fill="#86868b"/>
  <text x="500" y="178" text-anchor="middle" font-size="12" fill="#86868b">자동 감지</text>

  <!-- card 3 (accent) -->
  <rect x="521" y="150" width="186" height="88" rx="12" fill="#0071e3"/>
  <text x="545" y="186" font-size="15" font-weight="600" fill="#ffffff">Vercel</text>
  <text x="545" y="210" font-size="13" fill="rgba(255,255,255,0.85)">빌드와 실행</text>

  <line x1="707" y1="194" x2="741" y2="194" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="749,194 740,189.5 740,198.5" fill="#86868b"/>
  <text x="728" y="178" text-anchor="middle" font-size="12" fill="#86868b">접속</text>

  <rect x="749" y="150" width="186" height="88" rx="12" fill="#ffffff" stroke="#d2d2d7"/>

  <text x="773" y="210" font-size="13" fill="#86868b">*.vercel.app</text>

  <text x="64" y="326" font-size="13" fill="#86868b">한 번 연결해 두면, 이후 여러분이 하는 일은 "커밋하고 push해 줘" 한 문장뿐입니다. 30초~1분 뒤 전 세계에 반영됩니다.</text>
