<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="740" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="740" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">관리자 대시보드 설계도 — 여섯 칸</text>

  <!-- ===== 왼쪽 : 폰 화면 목업 (64~624, 110~636) ===== -->
  <rect x="64" y="110" width="560" height="526" rx="24" fill="#ffffff" stroke="#d2d2d7"/>

  <!-- 상단바 -->
  <text x="84" y="146" font-size="15" font-weight="600" fill="#1d1d1f">관리자</text>
  <text x="604" y="146" text-anchor="end" font-size="12" fill="#86868b">30초마다 자동 갱신</text>
  <line x1="84" y1="166" x2="604" y2="166" stroke="#d2d2d7" stroke-width="1"/>

  <!-- 카드 1 : 서버 -->
  <rect x="84" y="186" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="223" text-anchor="middle" font-size="12" fill="#86868b">1</text>
  <circle cx="128" cy="217" r="5" fill="#34c759"/>
  <text x="148" y="222" font-size="14" font-weight="600" fill="#1d1d1f">서버</text>
  <text x="584" y="222" text-anchor="end" font-size="13" fill="#86868b">정상 · 240ms</text>

  <!-- 카드 2 : 데이터베이스 -->
  <rect x="84" y="260" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="297" text-anchor="middle" font-size="12" fill="#86868b">2</text>
  <circle cx="128" cy="291" r="5" fill="#34c759"/>
  <text x="148" y="296" font-size="14" font-weight="600" fill="#1d1d1f">데이터베이스</text>
  <text x="584" y="296" text-anchor="end" font-size="13" fill="#86868b">정상 · 88ms</text>

  <!-- 카드 3 : 카카오맵 -->
  <rect x="84" y="334" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="371" text-anchor="middle" font-size="12" fill="#86868b">3</text>
  <circle cx="128" cy="365" r="5" fill="#34c759"/>
  <text x="148" y="370" font-size="14" font-weight="600" fill="#1d1d1f">카카오맵</text>
  <text x="584" y="370" text-anchor="end" font-size="13" fill="#86868b">정상</text>

  <!-- 카드 4 : 날씨 -->
  <rect x="84" y="408" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="445" text-anchor="middle" font-size="12" fill="#86868b">4</text>
  <circle cx="128" cy="439" r="5" fill="#ff9f0a"/>
  <text x="148" y="444" font-size="14" font-weight="600" fill="#1d1d1f">날씨</text>
  <text x="584" y="444" text-anchor="end" font-size="13" fill="#86868b">캐시로 표시 중 · 마지막 성공 09:12</text>

  <!-- 카드 5 : 방문자 (상태등 없음) -->
  <rect x="84" y="482" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="519" text-anchor="middle" font-size="12" fill="#86868b">5</text>
  <text x="148" y="518" font-size="14" font-weight="600" fill="#1d1d1f">방문자</text>
  <text x="584" y="518" text-anchor="end" font-size="13" fill="#86868b">오늘 37 · 최근 7일 214</text>

  <!-- 카드 6 : 방명록 · 참석 (상태등 없음) -->
  <rect x="84" y="556" width="520" height="62" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="102" y="593" text-anchor="middle" font-size="12" fill="#86868b">6</text>
  <text x="148" y="592" font-size="14" font-weight="600" fill="#1d1d1f">방명록 · 참석</text>
  <text x="584" y="592" text-anchor="end" font-size="13" fill="#86868b">방명록 12 · 참석 24 / 불참 3 / 미정 5</text>

  <!-- ===== 오른쪽 : 설계 원칙 (656~936) ===== -->
  <rect x="656" y="110" width="280" height="112" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="676" y="152" font-size="15" font-weight="600" fill="#1d1d1f">숫자보다 색</text>
  <text x="676" y="180" font-size="12" fill="#86868b">괜찮은지 아닌지만</text>
  <text x="676" y="200" font-size="12" fill="#86868b">알면 된다</text>

  <rect x="656" y="250" width="280" height="112" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="676" y="292" font-size="15" font-weight="600" fill="#1d1d1f">폰에서 보인다</text>
  <text x="676" y="320" font-size="12" fill="#86868b">문제는 항상</text>
  <text x="676" y="340" font-size="12" fill="#86868b">밖에 있을 때 생긴다</text>

  <rect x="656" y="390" width="280" height="112" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="676" y="432" font-size="15" font-weight="600" fill="#1d1d1f">안 눌러도 갱신된다</text>
  <text x="676" y="460" font-size="12" fill="#86868b">30초마다 스스로</text>
  <text x="676" y="480" font-size="12" fill="#86868b">다시 확인한다</text>

  <rect x="656" y="530" width="280" height="106" rx="12" fill="#0071e3"/>
  <text x="676" y="578" font-size="14" font-weight="600" fill="#ffffff">5·6번 칸에는 색이 없다</text>
  <text x="676" y="606" font-size="13" fill="rgba(255,255,255,0.85)">숫자는 정상·비정상이 없으니까</text>

  <text x="64" y="694" font-size="13" fill="#86868b">숫자보다 색. 폰에서 보인다. 누르지 않아도 30초마다 갱신됩니다.</text>
</svg>
</body></html>
