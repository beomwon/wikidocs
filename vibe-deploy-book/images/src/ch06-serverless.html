<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">전통 서버와 서버리스</text>

  <!-- Left : 전통 서버 -->
  <rect x="68" y="120" width="400" height="300" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="100" y="162" font-size="17" font-weight="600" fill="#1d1d1f">전통 서버</text>
  <text x="100" y="186" font-size="13" fill="#86868b">24시간 영업 식당</text>
  <line x1="100" y1="208" x2="436" y2="208" stroke="#f0f0f2" stroke-width="1.5"/>
  <text x="100" y="244" font-size="14" fill="#1d1d1f">항상 켜져 있다</text>
  <text x="100" y="278" font-size="14" fill="#1d1d1f">기억(메모리)이 유지된다</text>
  <text x="100" y="312" font-size="14" fill="#1d1d1f">손님이 없어도 비용이 나간다</text>
  <text x="100" y="366" font-size="13" fill="#86868b">3장에서 uvicorn을 켜 두었던 내 노트북이</text>
  <text x="100" y="386" font-size="13" fill="#86868b">바로 이 방식이었습니다</text>

  <!-- Right : 서버리스 -->
  <rect x="532" y="120" width="400" height="300" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="564" y="162" font-size="17" font-weight="600" fill="#1d1d1f">서버리스</text>
  <text x="564" y="186" font-size="13" fill="#86868b">주문이 오면 나타나는 주방</text>
  <rect x="822" y="142" width="82" height="26" rx="13" fill="#0071e3"/>
  <text x="863" y="159.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">이 책의 방식</text>
  <line x1="564" y1="208" x2="900" y2="208" stroke="#f0f0f2" stroke-width="1.5"/>
  <text x="564" y="244" font-size="14" fill="#1d1d1f">요청이 올 때만 실행됐다 사라진다</text>
  <text x="564" y="278" font-size="14" fill="#1d1d1f">기억이 유지되지 않는다 — stateless</text>
  <text x="564" y="312" font-size="14" fill="#1d1d1f">쓴 만큼만 자원 사용 — 무료의 비결</text>
  <text x="564" y="366" font-size="13" fill="#86868b">깨어나는 데 걸리는 시간이 콜드 스타트,</text>
  <text x="564" y="386" font-size="13" fill="#86868b">첫 접속이 잠깐 느린 이유입니다</text>

  <text x="64" y="474" font-size="13" fill="#86868b">사라질 때 기억도 함께 사라지므로, 저장은 항상 살아 있는 외부 데이터베이스(7장, Neon)에 맡깁니다.</text>
</svg>
</body></html>
