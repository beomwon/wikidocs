<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="540" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">식당으로 이해하는 웹 서비스</text>

  <!-- Left card : 홀 -->
  <rect x="68" y="120" width="400" height="280" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="100" y="162" font-size="17" font-weight="600" fill="#1d1d1f">홀 — 프론트엔드</text>
  <text x="100" y="186" font-size="13" fill="#86868b">손님이 보는 곳</text>
  <line x1="100" y1="208" x2="436" y2="208" stroke="#f0f0f2" stroke-width="1.5"/>
  <text x="100" y="244" font-size="14" fill="#1d1d1f">화면, 버튼, 글씨 — 눈에 보이는 전부</text>
  <text x="100" y="278" font-size="14" fill="#1d1d1f">재료는 HTML · CSS · JavaScript</text>
  <text x="100" y="312" font-size="14" fill="#1d1d1f">각자의 폰에서 각자 그려진다</text>
  <text x="100" y="366" font-size="13" fill="#86868b">디자인이 마음에 안 들면 여기를 고친다 — 말로</text>

  <!-- Right card : 주방 -->
  <rect x="532" y="120" width="400" height="280" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="564" y="162" font-size="17" font-weight="600" fill="#1d1d1f">주방 — 백엔드</text>
  <text x="564" y="186" font-size="13" fill="#86868b">손님이 못 보는 곳</text>
  <line x1="564" y1="208" x2="900" y2="208" stroke="#f0f0f2" stroke-width="1.5"/>
  <text x="564" y="244" font-size="14" fill="#1d1d1f">메시지를 받아 저장하고, 다시 꺼내 준다</text>
  <text x="564" y="278" font-size="14" fill="#1d1d1f">도구는 FastAPI (파이썬)</text>
  <text x="564" y="312" font-size="14" fill="#1d1d1f">모두가 접속하는 공동의 장소</text>
  <text x="564" y="366" font-size="13" fill="#86868b">기능을 바꾸고 싶으면 여기를 고친다 — 역시 말로</text>

  <!-- API connector -->
  <text x="500" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#0071e3">API</text>
  <line x1="472" y1="258" x2="528" y2="258" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="534,258 525,253.5 525,262.5" fill="#86868b"/>
  <polygon points="466,258 475,253.5 475,262.5" fill="#86868b"/>
  <text x="500" y="284" text-anchor="middle" font-size="12" fill="#86868b">주문서 양식</text>

  <text x="64" y="474" font-size="13" fill="#86868b">홀과 주방이 소통하는 정해진 창구가 API입니다. "메시지 목록 줘", "이 메시지 저장해 줘" 같은 주문이 오갑니다.</text>
</svg>
</body></html>
