<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">세 겹의 방어막이 놓이는 자리</text>

  <!-- ================= label boxes ================= -->

  <!-- 폴백 (return leg) -->
  <rect x="64" y="100" width="272" height="122" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="92" y="132" font-size="15" font-weight="600" fill="#1d1d1f">폴백</text>
  <text x="92" y="158" font-size="13" fill="#86868b">실패해도 뭔가는 보여준다</text>
  <text x="92" y="180" font-size="13" fill="#86868b">본체는 절대 막지 않는다</text>

  <!-- 캐싱 -->
  <rect x="356" y="100" width="288" height="122" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="384" y="132" font-size="15" font-weight="600" fill="#1d1d1f">캐싱 · 15분</text>
  <text x="384" y="158" font-size="13" fill="#86868b">이미 받아둔 답이 있으면</text>
  <text x="384" y="180" font-size="13" fill="#86868b">기상청에 안 묻는다</text>
  <text x="384" y="202" font-size="13" fill="#86868b">하객 100명이 와도 호출은 몇 번뿐</text>

  <!-- 타임아웃 -->
  <rect x="664" y="100" width="272" height="122" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="692" y="132" font-size="15" font-weight="600" fill="#1d1d1f">타임아웃 · 4초</text>
  <text x="692" y="158" font-size="13" fill="#86868b">4초까지만 기다리고 포기한다</text>
  <text x="692" y="180" font-size="13" fill="#86868b">기상청이 느려도</text>
  <text x="692" y="202" font-size="13" fill="#86868b">초대장은 안 멈춘다</text>

  <!-- connectors from each label box down to its bar -->
  <line x1="250" y1="222" x2="250" y2="248" stroke="#d2d2d7" stroke-width="1"/>
  <line x1="376" y1="222" x2="376" y2="248" stroke="#d2d2d7" stroke-width="1"/>
  <line x1="698" y1="222" x2="698" y2="248" stroke="#d2d2d7" stroke-width="1"/>

  <!-- ================= request path ================= -->

  <!-- forward lane : 요청 -->
  <line x1="204" y1="284" x2="392" y2="284" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="392,279 400,284 392,289" fill="#86868b"/>
  <line x1="600" y1="284" x2="788" y2="284" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="788,279 796,284 788,289" fill="#86868b"/>
  <text x="650" y="274" text-anchor="middle" font-size="12" fill="#86868b">요청</text>

  <!-- return lane : 응답 -->
  <line x1="796" y1="316" x2="608" y2="316" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="608,311 600,316 608,321" fill="#86868b"/>
  <line x1="400" y1="316" x2="212" y2="316" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="212,311 204,316 212,321" fill="#86868b"/>
  <text x="650" y="334" text-anchor="middle" font-size="12" fill="#86868b">응답</text>

  <!-- nodes -->
  <rect x="64" y="258" width="140" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="134" y="303" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">방문자</text>

  <rect x="400" y="258" width="200" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="500" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">내 서버</text>
  <text x="500" y="316" text-anchor="middle" font-size="13" fill="#86868b">/api/weather</text>

  <rect x="796" y="258" width="140" height="80" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="866" y="303" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1f">기상청</text>

  <!-- the three shields -->
  <rect x="248" y="248" width="4" height="100" fill="#0071e3"/>
  <rect x="374" y="248" width="4" height="100" fill="#0071e3"/>
  <rect x="696" y="248" width="4" height="100" fill="#0071e3"/>

  <!-- ================= two invitation cards ================= -->

  <text x="64" y="396" font-size="13" font-weight="600" fill="#1d1d1f">정상</text>
  <text x="532" y="396" font-size="13" font-weight="600" fill="#1d1d1f">날씨 실패</text>

  <rect x="64" y="408" width="404" height="158" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="92" y="436" font-size="14" fill="#1d1d1f">날짜 · 10월 3일 토요일</text>
  <text x="92" y="462" font-size="14" fill="#1d1d1f">장소 · 강남구 ○○로 12</text>
  <text x="92" y="488" font-size="14" fill="#1d1d1f">지도 (카카오맵)</text>
  <text x="92" y="514" font-size="14" fill="#1d1d1f">맑음 24도</text>
  <text x="92" y="540" font-size="14" fill="#1d1d1f">방명록</text>

  <line x1="500" y1="408" x2="500" y2="566" stroke="#d2d2d7" stroke-width="1"/>

  <rect x="532" y="408" width="404" height="158" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="560" y="436" font-size="14" fill="#1d1d1f">날짜 · 10월 3일 토요일</text>
  <text x="560" y="462" font-size="14" fill="#1d1d1f">장소 · 강남구 ○○로 12</text>
  <text x="560" y="488" font-size="14" fill="#1d1d1f">지도 (카카오맵)</text>
  <text x="560" y="514" font-size="14" fill="#86868b">오전 9시 기준 맑음 24도</text>
  <text x="560" y="540" font-size="14" fill="#1d1d1f">방명록</text>

  <rect x="64" y="584" width="872" height="36" rx="12" fill="#0071e3"/>
  <text x="500" y="607" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">본체는 그대로. 날씨 칸만 바뀐다</text>

  <text x="64" y="654" font-size="13" fill="#86868b">초대장의 본체는 어떤 경우에도 열려야 합니다. 지도와 날씨는 부가 정보입니다.</text>
</svg>
</body></html>
