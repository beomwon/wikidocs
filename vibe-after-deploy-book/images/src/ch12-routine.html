<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="580" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">운영 루틴 — 1년에 한 시간이 안 됩니다</text>

  <!-- ===== 타임라인 ===== -->
  <line x1="64" y1="300" x2="716" y2="300" stroke="#d2d2d7" stroke-width="2"/>
  <circle cx="180" cy="300" r="6" fill="#0071e3"/>
  <circle cx="320" cy="300" r="6" fill="#0071e3"/>
  <circle cx="460" cy="300" r="6" fill="#0071e3"/>
  <circle cx="600" cy="300" r="6" fill="#0071e3"/>
  <line x1="180" y1="260" x2="180" y2="294" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="320" y1="306" x2="320" y2="340" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="460" y1="260" x2="460" y2="294" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="600" y1="306" x2="600" y2="340" stroke="#d2d2d7" stroke-width="1.5"/>

  <!-- ===== 시점 1 : 평소 (위) ===== -->
  <rect x="64" y="112" width="232" height="148" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="84" y="144" font-size="14" font-weight="600" fill="#1d1d1f">평소</text>
  <text x="84" y="164" font-size="12" font-weight="600" fill="#0071e3">한 달에 한 번 · 5분</text>
  <text x="84" y="190" font-size="12" fill="#86868b">· 여섯 칸 상태 확인</text>
  <text x="84" y="209" font-size="12" fill="#86868b">· 방명록 훑어보기</text>
  <text x="84" y="228" font-size="12" fill="#86868b">· 도메인 만료일 확인</text>
  <text x="84" y="247" font-size="12" fill="#86868b">· 서비스 안내 메일 확인</text>

  <!-- ===== 시점 2 : 모임 전날 (아래) ===== -->
  <rect x="204" y="340" width="232" height="148" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="224" y="372" font-size="14" font-weight="600" fill="#1d1d1f">모임 전날</text>
  <text x="224" y="392" font-size="12" font-weight="600" fill="#0071e3">3분</text>
  <text x="224" y="418" font-size="12" fill="#86868b">· 여섯 칸 확인</text>
  <text x="224" y="437" font-size="12" fill="#86868b">· 비 예보면 공지 수정</text>
  <text x="224" y="456" font-size="12" fill="#86868b">· 방명록에 이상한 글 확인</text>
  <text x="224" y="475" font-size="12" fill="#86868b">· 기능은 손대지 않는다</text>

  <!-- ===== 시점 3 : 모임 당일 아침 (위) ===== -->
  <rect x="344" y="112" width="232" height="148" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="364" y="144" font-size="14" font-weight="600" fill="#1d1d1f">모임 당일 아침</text>
  <text x="364" y="164" font-size="12" font-weight="600" fill="#0071e3">1분</text>
  <text x="364" y="190" font-size="12" fill="#86868b">· 한 번 더 열어보기</text>
  <text x="364" y="209" font-size="12" fill="#86868b">· 1년 중 가장 붐비는 날</text>
  <text x="364" y="228" font-size="12" fill="#86868b">· 초록이면 준비 끝</text>

  <!-- ===== 시점 4 : 모임이 끝난 뒤 (아래) ===== -->
  <rect x="484" y="340" width="232" height="148" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="504" y="372" font-size="14" font-weight="600" fill="#1d1d1f">모임이 끝난 뒤</text>
  <text x="504" y="392" font-size="12" font-weight="600" fill="#0071e3">그날 이후</text>
  <text x="504" y="418" font-size="12" fill="#86868b">· 방명록은 PDF로 보관</text>
  <text x="504" y="437" font-size="12" fill="#86868b">· 서브도메인은 남겨 둔다</text>
  <text x="504" y="456" font-size="12" fill="#86868b">· 다음 모임에 재사용</text>

  <!-- ===== 오른쪽 끝 : 안 해도 되는 것 ===== -->
  <rect x="740" y="238" width="196" height="124" rx="12" fill="#0071e3"/>
  <text x="760" y="274" font-size="14" font-weight="600" fill="#ffffff">안 해도 되는 것</text>
  <text x="760" y="302" font-size="12" fill="rgba(255,255,255,0.85)">매일 들여다보기</text>
  <text x="760" y="322" font-size="12" fill="rgba(255,255,255,0.85)">방문자 수 신경 쓰기</text>
  <text x="760" y="342" font-size="12" fill="rgba(255,255,255,0.85)">알림 늘리기</text>

  <text x="64" y="534" font-size="13" fill="#86868b">매일 들여다보지 않습니다. 방문자 수에 신경 쓰지 않습니다. 알림을 늘리지 않습니다.</text>
</svg>
</body></html>
