<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">코드를 GitHub으로 보내는 세 동작</text>

  <!-- card 1 : add -->
  <rect x="77" y="140" width="250" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="105" y="182" font-size="19" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">add</text>
  <text x="105" y="210" font-size="14" fill="#1d1d1f">상자에 물건 담기</text>
  <text x="105" y="234" font-size="13" fill="#86868b">보낼 파일 고르기</text>

  <line x1="327" y1="200" x2="367" y2="200" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="375,200 366,195.5 366,204.5" fill="#86868b"/>

  <!-- card 2 : commit -->
  <rect x="375" y="140" width="250" height="120" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="403" y="182" font-size="19" font-weight="700" fill="#1d1d1f" font-family="Consolas, monospace">commit</text>
  <text x="403" y="210" font-size="14" fill="#1d1d1f">상자 봉하고 송장 쓰기</text>
  <text x="403" y="234" font-size="13" fill="#86868b">저장 시점을 기록</text>

  <line x1="625" y1="200" x2="665" y2="200" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="673,200 664,195.5 664,204.5" fill="#86868b"/>

  <!-- card 3 : push (accent) -->
  <rect x="673" y="140" width="250" height="120" rx="12" fill="#0071e3"/>
  <text x="701" y="182" font-size="19" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">push</text>
  <text x="701" y="210" font-size="14" fill="#ffffff">택배 발송</text>
  <text x="701" y="234" font-size="13" fill="rgba(255,255,255,0.85)">GitHub으로 전송</text>

  <text x="64" y="326" font-size="13" fill="#86868b">담지 않으면 봉해지지 않고, 봉하지 않으면 발송되지 않습니다. 그리고 5장부터는 push가 곧 배포 버튼이 됩니다.</text>
</svg>
</body></html>
