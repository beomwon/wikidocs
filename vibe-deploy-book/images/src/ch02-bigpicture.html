<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head>
<body>
<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="64" y="72" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">친구가 초대장을 여는 3초 동안 일어나는 일</text>

  <!-- Node 1 : 친구의 폰 (accent) -->
  <rect x="320" y="112" width="360" height="76" rx="12" fill="#0071e3"/>
  <text x="352" y="146" font-size="17" font-weight="600" fill="#ffffff">친구의 폰</text>
  <text x="352" y="170" font-size="13" fill="rgba(255,255,255,0.8)">브라우저에 invite.gildong.com 입력</text>

  <!-- Arrow 1 -->
  <line x1="500" y1="188" x2="500" y2="240" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="500,248 495.5,239 504.5,239" fill="#86868b"/>
  <circle cx="500" cy="214" r="11" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/>
  <text x="500" y="218.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">1</text>
  <text x="524" y="218.5" font-size="13" fill="#86868b">이 주소, 실제 위치가 어디야?</text>

  <!-- Node 2 : DNS -->
  <rect x="320" y="252" width="360" height="76" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="352" y="286" font-size="17" font-weight="600" fill="#1d1d1f">DNS</text>
  <text x="352" y="310" font-size="13" fill="#86868b">이름을 IP 주소로 바꿔 주는 인터넷 전화번호부</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="328" x2="500" y2="380" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="500,388 495.5,379 504.5,379" fill="#86868b"/>
  <circle cx="500" cy="354" r="11" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/>
  <text x="500" y="358.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">2</text>
  <text x="524" y="358.5" font-size="13" fill="#86868b">초대장 페이지 요청 · HTTPS로 암호화</text>

  <!-- Node 3 : Vercel container -->
  <rect x="240" y="392" width="520" height="180" rx="12" fill="#f5f5f7"/>
  <text x="272" y="428" font-size="17" font-weight="600" fill="#1d1d1f">Vercel 서버</text>
  <text x="404" y="428" font-size="13" fill="#86868b">클라우드에서 24시간 대기</text>

  <rect x="272" y="448" width="220" height="96" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="296" y="482" font-size="15" font-weight="600" fill="#1d1d1f">프론트엔드</text>
  <text x="296" y="504" font-size="13" fill="#86868b">index.html</text>
  <text x="296" y="524" font-size="13" fill="#86868b">초대장 화면을 전송</text>

  <rect x="508" y="448" width="220" height="96" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="532" y="482" font-size="15" font-weight="600" fill="#1d1d1f">백엔드</text>
  <text x="532" y="504" font-size="13" fill="#86868b">FastAPI · main.py</text>
  <text x="532" y="524" font-size="13" fill="#86868b">메시지 저장과 조회</text>

  <!-- Arrow 3 -->
  <line x1="500" y1="572" x2="500" y2="624" stroke="#86868b" stroke-width="1.5"/>
  <polygon points="500,632 495.5,623 504.5,623" fill="#86868b"/>
  <circle cx="500" cy="598" r="11" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/>
  <text x="500" y="602.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">3</text>
  <text x="524" y="602.5" font-size="13" fill="#86868b">저장된 축하 메시지 조회 · API</text>

  <!-- Node 4 : Neon -->
  <rect x="320" y="636" width="360" height="76" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="352" y="670" font-size="17" font-weight="600" fill="#1d1d1f">Neon 데이터베이스</text>
  <text x="352" y="694" font-size="13" fill="#86868b">축하 메시지가 사라지지 않고 저장되는 곳</text>

  <!-- Footnote -->
  <text x="64" y="762" font-size="13" fill="#86868b">GitHub은 이 그림에 없습니다 — 친구의 접속과 무관한, 코드를 서버로 보내는 무대 뒤 통로입니다 (4장)</text>
</svg>
</body></html>
